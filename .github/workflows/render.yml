name: Render 3D Horror 25-Min Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install FFmpeg, Hindi Fonts & Python Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -fv
          python -m pip install --upgrade pip
          pip install edge-tts mutagen requests numpy pillow

      - name: Restore cached scenes & audio
        uses: actions/cache@v4
        with:
          path: 2026-11-13_Project_18_9Hz_3D_V3
          key: project18-v3-cache-${{ github.run_id }}
          restore-keys: |
            project18-v3-cache-

      - name: Run 3D Horror 25-Min Pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          python build_movie.py

      - name: Upload Final 25-Min Horror Video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Project-18-3D-V3-HORROR-2026-11-13
          path: 2026-11-13_Project_18_9Hz_3D_V3/*.mp4
          retention-days: 5
