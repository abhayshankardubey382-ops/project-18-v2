name: Render 3D V2 25-Min Video

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Restore 3D V2 Cache
        uses: actions/cache@v4
        with:
          path: 2026-11-13_Project_18_9Hz_3D_V2
          key: project-18-3d-v2-${{ github.run_id }}
          restore-keys: |
            project-18-3d-v2-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install FFmpeg, Hindi Fonts & Python Deps
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-core fontconfig
          fc-cache -fv
          pip install edge-tts mutagen requests

      - name: Run 3D V2 25-Min Pipeline
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python build_movie.py

      - name: Upload 3D V2 Final Video & Parts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Project-18-3D-V2-2026-11-13
          path: 2026-11-13_Project_18_9Hz_3D_V2/
